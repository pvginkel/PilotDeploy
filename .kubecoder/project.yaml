# Curated entry points for PilotDeploy. Helm, Terraform and the tests live in the `iac` toolchain
# sidecar, the chart dependency resolver in `aac-tools`, so the verbs carry their `cexec` prefix
# here and only here.
projects:
  root:
    description: >-
      Pilot's deploy repo: the `pilot` Helm chart on the homelab-shared library dependency, the
      prd configuration Argo CD syncs it from, the Terraform its PreSync hook applies, and the
      judgment layer of the `pilot-deploy` architecture producer. There is no deploy pipeline:
      Argo deploys it, once ArgoCDDeploy's registry carries it.
    jenkins: AaC/PilotDeploy
    # helm lint reads the built dependency, so the deps step comes first. The hook.* values stand
    # in for the four helm parameters the Application passes; the library `required`-guards each.
    lint:
      - cexec aac-tools chart-deps
      - >-
        cexec iac helm lint chart --namespace pilot-prd --values config/prd/values.yaml
        --set hook.repo=https://github.com/pvginkel/PilotDeploy.git,hook.revision=0123456789abcdef0123456789abcdef01234567,hook.stage=prd,hook.namespace=pilot-prd
      - cexec iac terraform fmt -check -diff -recursive
    # tests/render-chart.py renders prd as the Application pilot-prd does and asserts on the
    # objects; tf-check checks terraform/ and tests/terraform-test.py plans prd's tfvars against
    # mocked providers.
    test:
      - cexec aac-tools chart-deps
      - cexec iac tests/render-chart.py
      - cexec iac tf-check
      - cexec iac tests/terraform-test.py
      # The architecture, generated twice. First with PilotApp's model beside this checkout
      # overlaid, so the app's products and its backend's recipes resolve published or not; then
      # against the published dataset alone, as AaC/PilotDeploy generates it. A product or recipe
      # that resolves nowhere is a gap and gen-architecture exits 0, so tests/architecture-test.py
      # is what fails.
      - >-
        ARCH_DATASET_OVERLAY=../PilotApp/docs/architecture/architecture.yaml
        cexec aac-tools gen-architecture --stage prd --producer pilot-deploy
      - cexec aac-tools arch-validate docs/architecture/pilot-deploy.yaml
      - cexec iac tests/architecture-test.py --resolved
      - cexec aac-tools gen-architecture --stage prd --producer pilot-deploy
      - cexec aac-tools arch-validate docs/architecture/pilot-deploy.yaml
      - cexec iac tests/architecture-test.py
