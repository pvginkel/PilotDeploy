# Curated entry points for PilotDeploy. Helm, Terraform and the tests live in the `iac` toolchain
# sidecar, the chart dependency resolver in `aac-tools`, so the verbs carry their `cexec` prefix
# here and only here.
projects:
  root:
    description: >-
      Pilot's deploy repo: the `pilot` Helm chart on the homelab-shared library dependency, the
      dev and prd configurations Argo CD syncs it from, the Terraform its PreSync hook applies,
      the promotion job `PilotApp/Promote-PRD` (`Jenkinsfile.promote`), and the judgment layer of
      the architecture producers `pilot-deploy`, which publishes prd from the `prd` branch, and
      `pilot-dev-deploy`, which publishes dev from `main`. Argo
      CD deploys `pilot-dev` from `main`, where every green PilotApp build pins its images, and
      `pilot-prd` from `prd`, which only the promotion job moves: started by hand, it retags the
      images a commit on `main` pins from `dev-<n>` to `prd-<n>`, fast-forwards `prd` to it and
      tags the release.
    jenkins: AaC/PilotDeploy
    # helm lint reads the built dependency, so the deps step comes first. The hook.* values stand
    # in for the four helm parameters each stage's Application passes; the library
    # `required`-guards each.
    lint:
      - cexec aac-tools chart-deps
      - >-
        cexec iac helm lint chart --namespace pilot-prd --values config/prd/values.yaml
        --set hook.repo=https://github.com/pvginkel/PilotDeploy.git,hook.revision=0123456789abcdef0123456789abcdef01234567,hook.stage=prd,hook.namespace=pilot-prd
      - >-
        cexec iac helm lint chart --namespace pilot-dev --values config/dev/values.yaml
        --set hook.repo=https://github.com/pvginkel/PilotDeploy.git,hook.revision=0123456789abcdef0123456789abcdef01234567,hook.stage=dev,hook.namespace=pilot-dev
      - cexec iac terraform fmt -check -diff -recursive
    # tests/render-chart.py renders each stage as its Application pilot-<stage> does and asserts
    # on the objects; tf-check checks terraform/ and tests/terraform-test.py plans each stage's
    # tfvars against mocked providers. Then each stage's architecture.
    test:
      - cexec aac-tools chart-deps
      - cexec iac tests/render-chart.py
      - cexec iac tf-check
      - cexec iac tests/terraform-test.py
      # Each stage's architecture, generated twice. First with PilotApp's model beside this
      # checkout overlaid, so the app's products and its backend's recipes resolve published or
      # not; then against the published dataset alone, as AaC/PilotDeploy (prd) and
      # AaC/PilotDeployDev (dev) generate it. A product or recipe that resolves nowhere is a gap
      # and gen-architecture exits 0, so tests/architecture-test.py is what fails.
      - >-
        ARCH_DATASET_OVERLAY=../PilotApp/docs/architecture/architecture.yaml
        cexec aac-tools gen-architecture --stage prd --producer pilot-deploy
      - cexec aac-tools arch-validate docs/architecture/pilot-deploy.yaml
      - cexec iac tests/architecture-test.py --stage prd --resolved
      - cexec aac-tools gen-architecture --stage prd --producer pilot-deploy
      - cexec aac-tools arch-validate docs/architecture/pilot-deploy.yaml
      - cexec iac tests/architecture-test.py --stage prd
      - >-
        ARCH_DATASET_OVERLAY=../PilotApp/docs/architecture/architecture.yaml
        cexec aac-tools gen-architecture --stage dev --producer pilot-dev-deploy
      - cexec aac-tools arch-validate docs/architecture/pilot-dev-deploy.yaml
      - cexec iac tests/architecture-test.py --stage dev --resolved
      - cexec aac-tools gen-architecture --stage dev --producer pilot-dev-deploy
      - cexec aac-tools arch-validate docs/architecture/pilot-dev-deploy.yaml
      - cexec iac tests/architecture-test.py --stage dev
