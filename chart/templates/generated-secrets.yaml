{{- /*
The secrets nothing outside the pod reads: Flask's SECRET_KEY, the drain endpoint's bearer and the
SSE gateway's callback secret. ESO generates each once (refreshInterval 0) into the Secret's
`password` key instead of `randAlphaNum` at render time: a random render leaves an Argo
Application forever OutOfSync and rolls the pod on every sync. Wave -1, so the Secrets exist
before the Deployment that reads them is applied.
*/}}
{{- range $name := list "pilot-secret-key" "pilot-drain-auth" "pilot-sse-callback" }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "0"
  target:
    name: {{ $name }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $name }}
{{- end }}
