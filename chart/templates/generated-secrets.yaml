{{- /*
The secrets nothing outside the namespace reads: Flask's SECRET_KEY, the drain endpoint's bearer, and
the bearer between the collector and the backend, which both pods read. ESO generates each once
(refreshInterval 0) into the Secret's `password` key instead of `randAlphaNum` at render time: a
random render leaves an Argo Application forever OutOfSync and rolls the pods on every sync. Wave
-1, so the Secrets exist before the Deployments that read them are applied.
*/}}
{{- range $name := list "pilot-secret-key" "pilot-drain-auth" "pilot-collector-token" }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "0"
  target:
    name: {{ $name }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $name }}
{{- end }}
