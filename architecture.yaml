# The judgment layer the aac-tools generator reads to publish this repo's prd stage as producer
# `pilot-deploy` (Jenkinsfile.architecture). Everything else in the artifact is derived from the
# render; the schema is what `gen-architecture --help` prints from the aac-tools toolchain.

# The first commit carrying the chart. This repo was created for Pilot, so its history dates the
# app.
introduced: '2026-10-14'

# Pilot's products, services and edges are the `pilot-app` producer's (pvginkel/PilotApp), so the
# layer references its app:* products and the generator resolves them to that producer's UUIDs. The
# backend's image runs the `migrate` init container, the `backend` container and the MCP server's
# `mcp` container; the UI is the app's second image.
images:
  pilot: app:pilot
  pilot-ui: app:pilot-ui

# The Service's port `http` is the UI's nginx, the pod's front. The entry names it outright, so the
# host is the UI's whether or not app:pilot-ui resolves.
exposures:
  pilot: ui

# The operator's UI, every stage: the host each stage's Service carries, pilot.ginbov.nl prd's and
# pilot-dev.home dev's. A stage renders only its own host, so each producer marks only its own. The
# MCP server's hosts, pilot-mcp.home and pilot-dev-mcp.home, are machine endpoints.
webUi:
  - pilot.ginbov.nl
  - pilot-dev.home
