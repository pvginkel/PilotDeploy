# The dev stage's values for the pilot chart, as Argo CD's Application pilot-dev renders it: on the
# prd cluster beside pilot-prd, on production's Keycloak realm and Postgres substrate, with its own
# client, database and secrets, and with kubecoder-dev's controller, never the operator's own
# fleet.

# The backend's STAGE.
stage: dev

# The site, and the backend's BASEURL under it: the dev client (eso/prd/pilot/dev/oidc below)
# registers https://pilot-dev.home/* as a valid redirect URI and https://pilot-dev.home as a web
# origin. Internal: the front door serves it over HTTPS from a homelab step-ca certificate, and the
# homelab DNS publishes the name (chart/templates/service.yaml).
host: pilot-dev.home
public: false

# Pilot's MCP server, at https://<host>/mcp: the backend hands every session it creates that
# address (MCP_SERVER_URL). Internal, whatever the site is: the front door serves it over HTTPS
# from a homelab step-ca certificate (chart/templates/mcp-service.yaml).
mcp:
  host: pilot-dev-mcp.home

# The existing public Keycloak's realm.
oidc:
  issuerUrl: https://auth.ginbov.nl/realms/homelab

# The shared postgres-pas substrate's pooler, where terraform/'s database lives.
db:
  host: postgres-pooler-rw.postgres-pas-prd.svc.cluster.local

# The links in text: a ticket id opens its YouTrack issue, {id} where the id goes, and an
# environment opens in VS Code through kubecoder-dev, at <base>/environments/<env-id>/ssh/open.
links:
  ticketUrlTemplate: https://issues.webathome.org/issue/{id}
  environmentLinkBaseUrl: https://kubecoder-dev.home

# kubecoder-dev's controller, which the backend's client calls (CONTROLLER_URL): its sessions and
# environments are that fleet's.
controller:
  url: https://kubecoder-dev.home

# The stage's store environment on kubecoder-dev's fleet (STORE_ENVIRONMENT_ID), the one environment
# whose pilot-sync sidecar the backend's sync admits.
store:
  environmentId: pvginkel-pilotprojects-d75970

# The brain's sessions, the chat's and every job's alike: their model (BRAIN_MODEL) and reasoning
# effort (BRAIN_REASONING_EFFORT), and the seconds after its last turn at which an open project
# chat closes (CHAT_CLOSE_TIMEOUT), the prompt cache's 55 minutes.
brain:
  model: opus
  reasoningEffort: xhigh
  chatCloseTimeout: 3300

# ESO wiring (homelab-shared.externalsecrets), from the dev stage's leaves on the prd cluster's
# OpenBao: its own OIDC client's id and secret, the token of Pilot's named client credential on
# kubecoder-dev, and its store's sync bearer. The app's other secrets are generated in the cluster
# (chart/templates/generated-secrets.yaml).
externalSecrets:
  storeRef:
    name: openbao-prd
  secrets:
    oidc:
      targetName: pilot-oidc
      data:
        - secretKey: client_id
          path: eso/prd/pilot/dev/oidc
          property: client_id
        - secretKey: client_secret
          path: eso/prd/pilot/dev/oidc
          property: client_secret
    kubecoder:
      targetName: pilot-kubecoder
      data:
        - secretKey: token
          path: eso/prd/pilot/dev/kubecoder
          property: token
    # The bearer the store's pilot-sync sidecar presents (SYNC_TOKEN), an ExternalSecret of its
    # own: while the leaf is missing, only the sync is refused.
    sync:
      targetName: pilot-sync
      data:
        - secretKey: token
          path: eso/prd/pilot/dev/sync
          property: token

images:
  # The backend's and the UI's builds, registry:5000/pilot and registry:5000/pilot-ui. Every green
  # PilotApp build pins both here as ":dev-<build number>", the tag it pushes, in one commit with
  # config/prd's ":prd-<build number>" (cicd.writeVersionPins), editing these block-style lines in
  # place; the pin step never creates a key.
  pilot: ':dev-81'
  pilotUI: ':dev-81'
