# The prd stage's values for the pilot chart, as Argo CD's Application pilot-prd renders it.

# The backend's STAGE.
stage: prd

# The site, and the backend's BASEURL under it: Keycloak's client pilot-app registers
# https://pilot.ginbov.nl/api/auth/callback as its redirect URI. Public: the front door serves it
# with a Let's Encrypt certificate (chart/templates/service.yaml).
host: pilot.ginbov.nl
public: true

# Pilot's MCP server, at https://<host>/mcp: the backend hands every session it creates that
# address (MCP_SERVER_URL), and its projects surface is at https://<host>/mcp/projects. Internal,
# whatever the site is: the front door serves it over HTTPS from a homelab step-ca certificate
# (chart/templates/mcp-service.yaml).
mcp:
  host: pilot-mcp.home

# The existing public Keycloak's realm.
oidc:
  issuerUrl: https://auth.ginbov.nl/realms/homelab

# The shared postgres-pas substrate's pooler, where terraform/'s database lives.
db:
  host: postgres-pooler-rw.postgres-pas-prd.svc.cluster.local

# The links in text: a ticket id opens its YouTrack issue, {id} where the id goes, and an
# environment opens in VS Code through KubeCoder, at <base>/environments/<env-id>/ssh/open.
links:
  ticketUrlTemplate: https://issues.webathome.org/issue/{id}
  environmentLinkBaseUrl: https://kubecoder.home

# KubeCoder's controller, which the backend's client calls (CONTROLLER_URL).
controller:
  url: https://kubecoder.home

# The stage's store environment on KubeCoder's fleet (STORE_ENVIRONMENT_ID), the one environment
# whose pilot-sync sidecar the backend's sync admits.
store:
  environmentId: pvginkel-pilotprojects-8b0225

# The brain's sessions, the chat's and every job's alike: their model (BRAIN_MODEL) and reasoning
# effort (BRAIN_REASONING_EFFORT), and the seconds after its last turn at which an open project
# chat closes (CHAT_CLOSE_TIMEOUT), the prompt cache's 55 minutes.
brain:
  model: opus
  reasoningEffort: xhigh
  chatCloseTimeout: 3300

# The gate's slot: the work items, each in an environment of its own, running or starting across
# every project (WORK_PARALLELISM_MAX) and in one project (PROJECT_PARALLELISM_MAX), at which the
# gate holds a work item's start. Left out, the backend's default stands: 3 across every project,
# and in one project the cross-project maximum.
work:
  parallelismMax: 5
  projectParallelismMax: 3

# ESO wiring (homelab-shared.externalsecrets), from the leaves the operator writes: the OIDC
# client's id and secret, the token of Pilot's named KubeCoder client credential, the store's sync
# bearer, the stage's VAPID key, YouTrack's webhook token, the service user's client and the
# projects surface's token. The app's other secrets are generated in the cluster
# (chart/templates/generated-secrets.yaml).
externalSecrets:
  storeRef:
    name: openbao-prd
  secrets:
    oidc:
      targetName: pilot-oidc
      data:
        - secretKey: client_id
          path: eso/prd/pilot/prd/oidc
          property: client_id
        - secretKey: client_secret
          path: eso/prd/pilot/prd/oidc
          property: client_secret
    kubecoder:
      targetName: pilot-kubecoder
      data:
        - secretKey: token
          path: eso/prd/pilot/prd/kubecoder
          property: token
    # The bearer the store's pilot-sync sidecar presents (SYNC_TOKEN), an ExternalSecret of its
    # own: while the leaf is missing, only the sync is refused.
    sync:
      targetName: pilot-sync
      data:
        - secretKey: token
          path: eso/prd/pilot/prd/sync
          property: token
    # The stage's VAPID key (VAPID_PRIVATE_KEY), P-256 as PKCS#8 PEM, which signs every web push.
    # Each browser's subscription is bound to its public key, so a new key ends them all: it is
    # kept in OpenBao, never generated in the cluster. A production backend refuses to start
    # without it.
    vapid:
      targetName: pilot-vapid
      data:
        - secretKey: private_key
          path: eso/prd/pilot/prd/vapid
          property: private_key
    # The stage's service user (PILOT_MCP_SERVICE_CLIENT_ID, PILOT_MCP_SERVICE_CLIENT_SECRET): the
    # Keycloak client whose client-credentials token the MCP server calls the API under, behind its
    # projects surface. An ExternalSecret of its own: while the leaf is missing, only that surface
    # is refused.
    serviceUser:
      targetName: pilot-service-user
      data:
        - secretKey: client_id
          path: eso/prd/pilot/prd/service-user
          property: client_id
        - secretKey: client_secret
          path: eso/prd/pilot/prd/service-user
          property: client_secret
    # The projects surface's token (PILOT_MCP_PROJECTS_TOKEN), the bearer its callers present. One
    # leaf for both stages, under neither's tree: an environment sends the same
    # PILOT_PROJECTS_TOKEN to whichever stage's surface it calls. An ExternalSecret of its own:
    # while the leaf is missing, only that surface is refused.
    projectsToken:
      targetName: pilot-projects-token
      data:
        - secretKey: token
          path: eso/prd/pilot/projects-token
          property: token
    # YouTrack's shared webhook token, a rotator-kept copy of the instance's, the backend's
    # YOUTRACK_WEBHOOK_TOKEN: the tracker-events endpoint compares it with each delivery's
    # X-YouTrack-Token. Production only, since the dev stage gets no tracker events.
    youtrackWebhookToken:
      targetName: pilot-youtrack-webhook-token
      data:
        - secretKey: token
          path: eso/prd/pilot/prd/youtrack-webhook-token
          property: token

images:
  # The backend's and the UI's builds, registry:5000/pilot and registry:5000/pilot-ui. Every green
  # PilotApp build pins both here as ":prd-<build number>", in one commit with config/dev's
  # ":dev-<build number>" (cicd.writeVersionPins), editing these block-style lines in place; the
  # pin step never creates a key. The prd-<n> tags are the promotion's retag of dev-<n>, and
  # pilot-prd runs a pin once the promotion has moved the prd branch it follows to a commit
  # carrying it.
  pilot: ':prd-170'
  pilotUI: ':prd-170'
